name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            artifact: pixtui-demo-linux-amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            artifact: pixtui-demo-linux-arm64
          - goos: windows
            goarch: amd64
            runner: windows-latest
            artifact: pixtui-demo-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            runner: macos-13
            artifact: pixtui-demo-darwin-amd64
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            artifact: pixtui-demo-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: go build -o ${{ matrix.artifact }} ./cmd/pixtui-demo/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
