name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            artifact: pixtui-demo-linux-amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            artifact: pixtui-demo-linux-arm64
          - goos: windows
            goarch: amd64
            runner: windows-latest
            artifact: pixtui-demo-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            runner: macos-13
            artifact: pixtui-demo-darwin-amd64
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            artifact: pixtui-demo-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: go build -ldflags="-s -w" -o ${{ matrix.artifact }} ./cmd/pixtui-demo/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Source Archive
        run: |
          git archive --format=tar.gz --prefix=PixTui/ -o dist/PixTui-source.tar.gz HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          body: |
            ## PixTui Release

            ### Downloads
            - **Linux (amd64)**: pixtui-demo-linux-amd64
            - **Linux (arm64)**: pixtui-demo-linux-arm64
            - **Windows (amd64)**: pixtui-demo-windows-amd64.exe
            - **macOS (amd64)**: pixtui-demo-darwin-amd64
            - **macOS (arm64)**: pixtui-demo-darwin-arm64
            - **Source Code**: PixTui-source.tar.gz
            - **Checksums**: checksums.txt

            ### Installation
            ```bash
            go get github.com/Gomobra/PixTui
            ```

            ### Verify checksums
            ```bash
            sha256sum -c checksums.txt
            ```

            ### Support
            If you find PixTui useful, consider donating:
            - **Bitcoin**: bc1qegkxu0cp2r83hne8642afst90l68du05datn3x
            - **TON**: UQCslWQYJEiaLlw4-Zl3qI4fYL0G0xV6KtIfTel-4pz11Ygt